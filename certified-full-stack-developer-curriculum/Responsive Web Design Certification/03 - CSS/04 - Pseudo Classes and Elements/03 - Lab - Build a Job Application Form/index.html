<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form id="job-application">
            <label for="name">Full Name:</label>
            <input id="name" type="text" name="name" placeholder="Enter your name" required>
            <label for="email">Email:</label>
            <input id="email" type="email" name="email" placeholder="Enter your email" required>
            <label for ="position">Position:</label>
            <select id="position" name="position" required>
                <option value>Select a position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
            </select>
            <fieldset class="radio-group">
                <legend>Availability</legend>
                <input id="fullTime" type="radio" name="availability" value="fullTime" chceked>
                <label for="fullTime">Full-Time</label>
                <input id="partTime" type="radio" name="availability" value="partTime">
                <label for="partTime">Part-Time</label>
            </fieldset>
            <label for="message">Why do you want this job?</label>
            <textarea id="message" placeholder="Write your motivation" required></textarea>
            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
